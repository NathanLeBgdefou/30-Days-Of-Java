name: Vérifier le cours Java
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verifier.py
