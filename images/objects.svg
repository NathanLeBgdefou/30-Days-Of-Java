<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title"><title id="title">Une classe Etudiant et deux instances indépendantes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2475a8"/></marker></defs><rect width="1200" height="500" rx="18" fill="#fff"/><text x="40" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#142d46" font-weight="bold" text-anchor="start">Une classe, deux objets</text><text x="40" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#577086" font-weight="normal" text-anchor="start">Chaque instance possède son propre état ; une référence désigne une instance.</text><rect x="440" y="120" width="320" height="100" rx="14" fill="#123b58" stroke="#123b58" stroke-width="2"/><text x="600" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle">Classe Etudiant</text><text x="600" y="196" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#d5ebfb" font-weight="normal" text-anchor="middle">prénom · crédits · méthodes</text><path d="M510 228 L320 287" fill="none" stroke="#2475a8" stroke-width="4" marker-end="url(#arrow)"/><path d="M690 228 L880 287" fill="none" stroke="#2475a8" stroke-width="4" marker-end="url(#arrow)"/><rect x="140" y="292" width="320" height="115" rx="14" fill="#e9f4fc" stroke="#bdd4e7" stroke-width="2"/><text x="300" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#142d46" font-weight="bold" text-anchor="middle">Alice</text><text x="300" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">36 crédits</text><rect x="740" y="292" width="320" height="115" rx="14" fill="#e9f4fc" stroke="#bdd4e7" stroke-width="2"/><text x="900" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" fill="#142d46" font-weight="bold" text-anchor="middle">Bob</text><text x="900" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">12 crédits</text><text x="321" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#142d46" font-weight="normal" text-anchor="middle">new</text><text x="879" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#142d46" font-weight="normal" text-anchor="middle">new</text></svg>