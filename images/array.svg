<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title"><title id="title">Tableau notes, valeurs et indices</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2475a8"/></marker></defs><rect width="1200" height="500" rx="18" fill="#fff"/><text x="40" y="55" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#142d46" font-weight="bold" text-anchor="start">Un tableau de trois valeurs</text><text x="40" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#577086" font-weight="normal" text-anchor="start">La longueur est 3 ; le dernier indice est 2.</text><rect x="235" y="158" width="200" height="110" rx="14" fill="#e9f4fc" stroke="#bdd4e7" stroke-width="2"/><text x="335" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#142d46" font-weight="bold" text-anchor="middle">12</text><text x="335" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">indice 0</text><rect x="465" y="158" width="200" height="110" rx="14" fill="#e9f4fc" stroke="#bdd4e7" stroke-width="2"/><text x="565" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#142d46" font-weight="bold" text-anchor="middle">15</text><text x="565" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">indice 1</text><rect x="695" y="158" width="200" height="110" rx="14" fill="#e9f4fc" stroke="#bdd4e7" stroke-width="2"/><text x="795" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" fill="#142d46" font-weight="bold" text-anchor="middle">9</text><text x="795" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">indice 2</text><text x="120" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#142d46" font-weight="bold" text-anchor="middle">notes</text><path d="M169 213 L225 213" fill="none" stroke="#2475a8" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="373" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#142d46" font-weight="normal" text-anchor="middle">notes[0] = 12     ·     notes[1] = 15     ·     notes[2] = 9</text></svg>